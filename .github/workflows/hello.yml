name: Run System Check

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  system-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Make script executable
        run: chmod +x system-check.sh

      - name: Run system-check.sh
        run: ./system-check.sh
